<title>女同人格測驗</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout concept: one-screen "app" — start card, a question stage with a
   back/progress rail, and a result stage with a hexagon trait-spectrum
   chart, swapped via [hidden]; flat neutral paper ground, no gendered
   decoration, a single earthy accent instead of a pink/pastel one */
:root{
  --bg:        #f5f3ee;
  --surface:   #ffffff;
  --surface-2: #eae6dd;
  --ink:       #211f1c;
  --ink-soft:  #6b665d;
  --line:      rgba(33,31,28,0.12);
  --accent:    #3c6e63;
  --accent-2:  #a98f4b;
  --accent-soft: rgba(60,110,99,0.12);

  --display: "Noto Serif TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:        #17181a;
    --surface:   #212224;
    --surface-2: #2a2b2d;
    --ink:       #ece9e2;
    --ink-soft:  #a7a39a;
    --line:      rgba(236,233,226,0.12);
    --accent:    #6fb3a3;
    --accent-2:  #d1b872;
    --accent-soft: rgba(111,179,163,0.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:        #17181a;
  --surface:   #212224;
  --surface-2: #2a2b2d;
  --ink:       #ece9e2;
  --ink-soft:  #a7a39a;
  --line:      rgba(236,233,226,0.12);
  --accent:    #6fb3a3;
  --accent-2:  #d1b872;
  --accent-soft: rgba(111,179,163,0.16);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.corner-hex{
  position:fixed; top:-60px; right:-60px;
  width:260px; height:260px;
  opacity:0.5; z-index:0; pointer-events:none;
  color:var(--line);
}
@media (prefers-reduced-motion:no-preference){
  .stage{ animation: rise .4s ease both; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
}

.wrap{
  position:relative; z-index:1;
  max-width:560px; margin:0 auto;
  padding-top: 36px;
  padding-bottom: 56px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  min-height:100svh;
  display:flex; flex-direction:column;
}

.eyebrow{
  font-family:var(--body); font-weight:700; font-size:13px;
  letter-spacing:0.14em; text-transform:uppercase;
  color:var(--accent);
  margin:0 0 10px;
}

/* ---------- start ---------- */
#start{ margin:auto 0; text-align:center; }
#start h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(34px, 8vw, 46px);
  line-height:1.25; margin:0 0 16px;
  text-wrap:balance;
}
#start p.lede{
  font-size:16px; line-height:1.75; color:var(--ink-soft);
  margin:0 auto 32px; max-width:46ch;
}
.type-chips{
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  margin-bottom:32px;
}
.type-chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; font-weight:600; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:999px; padding:7px 14px 7px 10px;
}
.type-chip svg{ width:15px; height:15px; color:var(--accent); flex:none; }
.tag{
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--body); font-weight:700; font-size:10.5px;
  letter-spacing:0.02em; line-height:1; white-space:nowrap;
  border-radius:999px; padding:3px 7px;
}
.tag-T{ background:var(--accent); color:var(--bg); }
.tag-P{ background:var(--accent-2); color:var(--bg); }
.tag-H{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
.btn-primary{
  font-family:var(--body); font-weight:700; font-size:17px;
  color:#fff; background:var(--ink);
  border:none; border-radius:16px;
  padding:16px 36px; cursor:pointer;
}
:root[data-theme="dark"] .btn-primary{ color:var(--bg); }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .btn-primary{ color:var(--bg); }
}
.btn-primary:active{ transform:scale(0.98); }
#start .meta{
  margin-top:18px; font-size:13px; color:var(--ink-soft);
}

/* ---------- quiz ---------- */
#quiz{ flex:1; display:flex; flex-direction:column; }
.rail{
  display:flex; align-items:center; gap:14px;
  margin-bottom:26px;
}
.back-btn{
  flex:none; width:38px; height:38px; border-radius:11px;
  border:1px solid var(--line); background:var(--surface);
  color:var(--ink-soft); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.back-btn svg{ width:18px; height:18px; }
.back-btn:active{ transform:scale(0.95); }
.rail-track{
  flex:1; height:6px; border-radius:4px;
  background:var(--line); overflow:hidden;
}
.rail-fill{
  height:100%; border-radius:4px;
  background:var(--accent);
  transition:width .35s ease;
}
.rail-count{
  font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:700; color:var(--ink-soft);
  white-space:nowrap;
}
.q-title{
  font-family:var(--display); font-weight:700;
  font-size:clamp(22px,5.4vw,27px); line-height:1.45;
  margin:0 0 22px;
  text-wrap:balance;
}
.options{ display:flex; flex-direction:column; gap:10px; }
.option{
  text-align:left;
  font-family:var(--body); font-size:15.5px; line-height:1.5; color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line); border-radius:14px;
  padding:16px 18px; cursor:pointer;
  transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.option:hover{ border-color:var(--accent); }
.option:active{ transform:scale(0.99); }
.option.picked{
  border-color:var(--accent);
  background:var(--accent-soft);
}

/* ---------- result ---------- */
.badge-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.badge{
  display:inline-flex; align-items:center; gap:7px;
  font-family:var(--body); font-weight:700; font-size:13.5px;
}
.badge.primary{
  color:#fff; background:var(--ink);
  border-radius:999px; padding:8px 16px 8px 10px;
}
:root[data-theme="dark"] .badge.primary{ color:var(--bg); }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .badge.primary{ color:var(--bg); }
}
.badge.secondary{
  color:var(--ink-soft); background:transparent;
  border:1px solid var(--line);
  border-radius:999px; padding:7px 15px 7px 9px;
}
.badge svg{ width:15px; height:15px; }
.hero-icon-circle{
  width:72px; height:72px; border-radius:50%;
  background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
  margin-bottom:16px;
}
.hero-icon-circle svg{ width:34px; height:34px; }

.secondary-card{
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:18px; padding:20px 20px 18px; margin-bottom:26px;
}
.secondary-head{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.mini-icon{
  width:46px; height:46px; border-radius:50%; flex:none;
  background:var(--surface); border:1px solid var(--line); color:var(--accent);
  display:flex; align-items:center; justify-content:center;
}
.mini-icon svg{ width:22px; height:22px; }
.secondary-card h3{
  font-family:var(--display); font-weight:700; font-size:18px;
  margin:0 0 2px;
}
.sec-tagline{ font-size:12.5px; color:var(--accent); font-weight:600; margin:0; }
.secondary-card p#sec-desc{
  font-size:14px; line-height:1.75; color:var(--ink-soft); margin:12px 0 0;
}
.trait-meta{ display:flex; flex-direction:column; gap:6px; margin:0 0 22px; }
.trait-row{ display:flex; gap:10px; font-size:13.5px; line-height:1.5; }
.trait-row .trait-label{
  flex:none; width:44px; color:var(--ink-soft); font-weight:700;
  font-size:12px; letter-spacing:0.04em; padding-top:1px;
}
.trait-row .trait-value{ color:var(--ink); }
.sec-meta{ font-size:12.5px; color:var(--ink-soft); margin:8px 0 0; line-height:1.6; }

#result h1{
  font-family:var(--display); font-weight:900;
  font-size:clamp(30px,8vw,42px); line-height:1.25;
  margin:0 0 10px; text-wrap:balance;
}
#result .tagline{
  font-size:16px; color:var(--accent); font-weight:700;
  margin:0 0 20px;
}
#result .desc{
  font-size:15.5px; line-height:1.85; color:var(--ink-soft);
  margin:0 0 8px;
}
#result .desc.flavor{ margin-bottom:30px; }

.spectrum-card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:18px; padding:24px 20px 20px; margin-bottom:28px;
}
.spectrum-card h2{
  font-family:var(--body); font-weight:700; font-size:13px;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft);
  margin:0 0 4px;
}
.spectrum-card .hint{
  font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; opacity:0.85;
}
.radar-figure{ position:relative; width:100%; max-width:300px; aspect-ratio:1; margin:0 auto; }
.radar-figure svg{ position:absolute; inset:0; width:100%; height:100%; }
.radar-vertex{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:4px;
  width:62px; text-align:center;
}
.radar-vertex svg{ width:16px; height:16px; color:var(--accent); flex:none; position:static; }
.radar-vertex .rv-name{ font-size:11px; font-weight:700; color:var(--ink); line-height:1.2; }

.attraction-card{
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:18px; padding:22px 22px 20px; margin-bottom:28px;
}
.attraction-card h2{
  font-family:var(--body); font-weight:700; font-size:13px;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft);
  margin:0 0 12px;
}
.attraction-card p{
  font-size:15px; line-height:1.85; color:var(--ink); margin:0;
}

#share-capture{ background:var(--bg); }

.share-caption{
  text-align:center; font-size:12px; color:var(--ink-soft);
  margin-top:8px; letter-spacing:0.02em;
}
.support-card{
  margin-top:28px; padding-top:22px; border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
}
.support-card p{ font-size:13.5px; color:var(--ink-soft); margin:0; }
.result-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.share-invite{
  margin-top:24px; padding-top:22px; border-top:1px solid var(--line);
  display:flex; flex-direction:column; align-items:flex-start; gap:12px;
}
.share-invite p{ font-size:14.5px; font-weight:600; color:var(--ink); margin:0; }
.btn-ghost{
  font-family:var(--body); font-weight:700; font-size:14.5px;
  color:var(--ink); background:transparent;
  border:1.5px solid var(--line); border-radius:14px;
  padding:13px 22px; cursor:pointer;
}
.btn-ghost:active{ transform:scale(0.98); }
.copied{ font-size:13px; color:var(--ink-soft); margin-top:10px; height:16px; }

footer{
  text-align:center; font-size:12.5px; color:var(--ink-soft);
  margin-top:40px;
}
</style>

<svg class="corner-hex" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <polygon points="100,10 182,55 182,145 100,190 18,145 18,55" stroke="currentColor" stroke-width="1.5"/>
</svg>

<div class="wrap">

  <section id="start" class="stage">
    <div class="eyebrow">女同人格測驗 · 12 題</div>
    <h1>你是哪一種<br>戀愛人設？</h1>
    <p class="lede">從約會風格、吵架反應到穿搭喜好，12 個情境題，看看你在感情裡比較靠近太陽系帥T、安靜系鐵T、奶狗系軟T、優雅系天鵝P、軟萌系兔子P，還是自由系變色龍——結果會依你的主型與副型組合，給出更多樣的描述。</p>
    <div class="type-chips" id="type-chips"></div>
    <button class="btn-primary" id="start-btn">開始測驗</button>
    <div class="meta">大約 2 分鐘 · 可返回修改答案 · 測完可重測</div>
  </section>

  <section id="quiz" class="stage" hidden>
    <div class="rail">
      <button class="back-btn" id="back-btn" type="button" aria-label="上一題">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="rail-track"><div class="rail-fill" id="rail-fill"></div></div>
      <div class="rail-count" id="rail-count">1 / 12</div>
    </div>
    <h2 class="q-title" id="q-title"></h2>
    <div class="options" id="q-options"></div>
  </section>

  <section id="result" class="stage" hidden>
    <div id="share-capture">
      <div class="eyebrow">測驗結果</div>
      <div class="badge-row" id="r-badges"></div>
      <div class="hero-icon" id="hero-icon"></div>
      <h1 id="r-name"></h1>
      <p class="tagline" id="r-tagline"></p>
      <div class="trait-meta" id="r-traits"></div>
      <p class="desc" id="r-desc"></p>
      <p class="desc flavor" id="r-flavor"></p>

      <div class="secondary-card" id="secondary-card" hidden>
        <h2 style="font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px;">副型介紹</h2>
        <div class="secondary-head">
          <span class="mini-icon" id="sec-icon"></span>
          <div>
            <h3 id="sec-name"></h3>
            <p class="sec-tagline" id="sec-tagline"></p>
          </div>
        </div>
        <p id="sec-desc"></p>
        <p class="sec-meta" id="sec-meta"></p>
      </div>

      <div class="spectrum-card">
        <h2>特質光譜</h2>
        <p class="hint">形狀代表六個向度的相對強弱，不是精確分數</p>
        <div class="radar-figure" id="radar"></div>
      </div>

      <div class="attraction-card">
        <h2>心動方向</h2>
        <p id="r-attract"></p>
      </div>

      <div class="share-caption">女同人格測驗・你也來測測看</div>
    </div>

    <div class="result-actions">
      <button class="btn-primary" id="retake-btn">重新測驗</button>
    </div>

    <div class="share-invite">
      <p>趕快傳給你的朋友一起來玩吧！</p>
      <button class="btn-ghost" id="copy-url-btn">複製網址</button>
    </div>
    <div class="copied" id="url-msg"></div>

    <div class="support-card" id="support-card" hidden>
      <p>如果喜歡這個測驗，想請我喝杯飲料也可以</p>
      <a class="btn-ghost" id="support-link" href="#" target="_blank" rel="noopener">贊助一下</a>
    </div>
  </section>

  <footer>用你平常的直覺作答，結果純屬娛樂，認真你就輸了。</footer>
</div>

<script>
(function(){

var ICONS = {
  sun:   '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  iron:  '<path d="M20 14.6A8.4 8.4 0 1 1 9.4 4a7 7 0 0 0 10.6 10.6z"/>',
  pup:   '<circle cx="12" cy="15.3" r="3.1"/><circle cx="6.6" cy="9.2" r="1.5"/><circle cx="10.2" cy="6.2" r="1.5"/><circle cx="13.8" cy="6.2" r="1.5"/><circle cx="17.4" cy="9.2" r="1.5"/>',
  swan:  '<path d="M19 5c-5 0-13.5 2-13.5 13.5"/><path d="M19 5c0 5-2.5 13.5-13.5 13.5"/><path d="M4.2 19.8l3-3"/>',
  bunny: '<path d="M9.3 11c-1.6-3-2.1-6.6-.6-8.1S12 3 12 7.2"/><path d="M14.7 11c1.6-3 2.1-6.6.6-8.1S12 3 12 7.2"/><circle cx="12" cy="14.8" r="5"/><circle cx="10" cy="14.3" r="0.65" fill="currentColor"/><circle cx="14" cy="14.3" r="0.65" fill="currentColor"/>',
  free:  '<path d="M8 15a3 3 0 1 1 0-6c2 0 3 1.6 4 3s2 3 4 3a3 3 0 1 0 0-6c-2 0-3 1.6-4 3s-2 3-4 3z"/>'
};
function iconSvg(type, size){
  size = size || 16;
  return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICONS[type]+'</svg>';
}

var TPH = { sun:"T", iron:"T", pup:"T", swan:"P", bunny:"P", free:"不分 / H" };
function tagHtml(type){
  var g = TPH[type];
  var cls = g === "T" ? "tag-T" : (g === "P" ? "tag-P" : "tag-H");
  return '<span class="tag ' + cls + '">' + g + '</span>';
}

var ORDER = ["sun","iron","pup","swan","bunny","free"];

var QUESTIONS = [
  { q: "需要做決定的時候，你通常會：", opts: [
    ["很快做出決定，然後說服大家一起走","sun"],
    ["自己先想清楚，才把決定說出來","iron"],
    ["想先問問大家的意見，一起討論","pup"],
    ["把各種選項都想過一輪，再選一個","swan"],
    ["比較依賴別人先做決定","bunny"],
    ["看當下狀況，沒有固定的做法","free"],
  ]},
  { q: "安排一場約會時，你通常會：", opts: [
    ["提早排好行程，直接跟對方說「到時候這樣走」","sun"],
    ["想法已經有了，但要過一段時間才會說出來","iron"],
    ["傳好幾個連結和想法，想一起討論再決定","pup"],
    ["選好餐廳、提前訂位，把細節都準備好","swan"],
    ["問對方想去哪，自己先不主動提意見","bunny"],
    ["看當下心情決定，常常前一天才確定","free"],
  ]},
  { q: "在朋友聚會裡，你通常會：", opts: [
    ["負責安排時間地點，主動揪人出來","sun"],
    ["話不多，但朋友有事情都會先想到你","iron"],
    ["很熱絡地帶動氣氛，讓大家聊起來","pup"],
    ["比較安靜觀察，想講話才開口","swan"],
    ["心情起伏會直接表現在臉上","bunny"],
    ["依場合調整自己，沒有固定狀態","free"],
  ]},
  { q: "團隊合作時，你通常會扮演的角色是：", opts: [
    ["主動帶頭，分配工作給大家","sun"],
    ["把自己負責的部分做到最好，不太需要盯","iron"],
    ["負責炒熱氣氛，讓團隊溝通比較順","pup"],
    ["負責規劃流程，確保進度不出差錯","swan"],
    ["比較習慣配合別人的安排","bunny"],
    ["看專案需要，角色常常不一樣","free"],
  ]},
  { q: "吵架之後，你通常會：", opts: [
    ["先自己想清楚，整理好想法才開口","iron"],
    ["很快傳訊息說明自己的想法，想趕快把話說開","pup"],
    ["先開口，把話題往下一步推進","sun"],
    ["比較少主動開口，等對方先聯絡","bunny"],
    ["把問題一條一條列出來，討論怎麼處理","swan"],
    ["看情況，有時候先開口，有時候等對方","free"],
  ]},
  { q: "週末你比較常做的事是：", opts: [

var state = { i: 0, answers: new Array(QUESTIONS.length).fill(null) };

/* start chips: one per base type, with icon + name + T/P/H tag */
(function(){

document.getElementById('back-btn').addEventListener('click', function(){
  if (state.i === 0){
    quizEl.hidden = true;
    startEl.hidden = false;
    return;
  }
  state.i -= 1;
  renderQuestion();
});

function renderQuestion(){
  var q = QUESTIONS[state.i];
  document.getElementById('rail-count').textContent = (state.i+1) + ' / ' + QUESTIONS.length;
  document.getElementById('rail-fill').style.width = ((state.i)/QUESTIONS.length*100) + '%';
  document.getElementById('q-title').textContent = q.q;
  var optsEl = document.getElementById('q-options');
  optsEl.innerHTML = '';
  var prevAnswer = state.answers[state.i];
  q.opts.forEach(function(opt){
    var btn = document.createElement('button');
    btn.className = 'option' + (prevAnswer === opt[1] ? ' picked' : '');
    btn.type = 'button';
    btn.textContent = opt[0];
    btn.addEventListener('click', function(){ pick(opt[1], btn); });
    optsEl.appendChild(btn);
  });
  quizEl.classList.remove('stage');
  void quizEl.offsetWidth;
  quizEl.classList.add('stage');
}

function pick(type, btn){
  var all = document.querySelectorAll('#q-options .option');
  all.forEach(function(b){ b.disabled = true; b.classList.remove('picked'); });
  btn.classList.add('picked');
  state.answers[state.i] = type;
  setTimeout(function(){
    state.i += 1;
    if (state.i < QUESTIONS.length){
      renderQuestion();
    } else {
      showResult();
    }
  }, 220);
}

function computeScores(){
  var scores = {sun:0,iron:0,pup:0,swan:0,bunny:0,free:0};
  state.answers.forEach(function(t){ if (t) scores[t] += 1; });
  return scores;
}

function drawRadar(scores){
  var size = 280, cx = size/2, cy = size/2, R = 76;
  var maxScore = Math.max.apply(null, ORDER.map(function(k){ return scores[k]; })) || 1;
  var pts = ORDER.map(function(k, idx){
    var angle = (-90 + idx*60) * Math.PI/180;
    var v = scores[k] / maxScore;
    var r = 14 + v * (R-14);
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  });
  var poly = pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');

  function ringPts(frac){
    return ORDER.map(function(k, idx){
      var angle = (-90 + idx*60) * Math.PI/180;
      var r = 14 + frac * (R-14);
      return (cx + r*Math.cos(angle)).toFixed(1)+','+(cy + r*Math.sin(angle)).toFixed(1);
    }).join(' ');
  }
  function ring(frac){
    return '<polygon points="'+ringPts(frac)+'" fill="none" stroke="var(--line)" stroke-width="1"/>';
  }

  var spokes = ORDER.map(function(k, idx){
    var angle = (-90 + idx*60) * Math.PI/180;
    var x = cx + R*Math.cos(angle), y = cy + R*Math.sin(angle);
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
  }).join('');

  var rings = [0.33,0.66,1].map(ring).join('');

  var svg = '<svg viewBox="0 0 '+size+' '+size+'">' +
    rings + spokes +
    '<polygon points="'+poly+'" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>' +
    pts.map(function(p){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="var(--accent)"/>'; }).join('') +
    '</svg>';

  var labelR = 118;
  var vertices = ORDER.map(function(k, idx){
    var angle = (-90 + idx*60) * Math.PI/180;
    var x = cx + labelR*Math.cos(angle), y = cy + labelR*Math.sin(angle);
    var left = (x/size*100).toFixed(2) + '%';
    var top = (y/size*100).toFixed(2) + '%';
    return '<div class="radar-vertex" style="left:'+left+';top:'+top+'">' +
      iconSvg(k,16) +
      '<span class="rv-name">' + RESULTS[k].name.replace(/系.*/, '') + '</span>' +
      tagHtml(k) +
      '</div>';
  }).join('');

  document.getElementById('radar').innerHTML = svg + vertices;
}

function showResult(){
  quizEl.hidden = true;
  resultEl.hidden = false;
  resultEl.classList.remove('stage');
  void resultEl.offsetWidth;
  resultEl.classList.add('stage');

  var scores = computeScores();
  var ranked = ORDER.slice().sort(function(a,b){ return scores[b]-scores[a]; });
  var primary = ranked[0];
  var secondary = ranked[1];
  var r = RESULTS[primary];

  var badgesEl = document.getElementById('r-badges');
  badgesEl.innerHTML =
    '<span class="badge primary">' + iconSvg(primary,15) + '<span>主型・' + r.name + '</span>' + tagHtml(primary) + '</span>' +
    (scores[secondary] > 0
      ? '<span class="badge secondary">' + iconSvg(secondary,15) + '<span>副型・' + RESULTS[secondary].name + '</span>' + tagHtml(secondary) + '</span>'
      : '');

  document.getElementById('hero-icon').innerHTML = '<span class="hero-icon-circle">' + iconSvg(primary,34) + '</span>';
  document.getElementById('r-name').textContent = r.name;
  document.getElementById('r-tagline').textContent = r.tagline;
  document.getElementById('r-traits').innerHTML =
    '<div class="trait-row"><span class="trait-label">性格</span><span class="trait-value">' + r.traits + '</span></div>' +
    '<div class="trait-row"><span class="trait-label">風格</span><span class="trait-value">' + r.style + '</span></div>';
  document.getElementById('r-desc').textContent = r.desc;
  document.getElementById('r-flavor').textContent = scores[secondary] > 0 ? FLAVOR[secondary] : PURE_LINE;
  document.getElementById('r-attract').textContent = ATTRACTION[primary];

  var secCard = document.getElementById('secondary-card');
  if (scores[secondary] > 0){
    var rs = RESULTS[secondary];
    document.getElementById('sec-icon').innerHTML = iconSvg(secondary,22);
    document.getElementById('sec-name').textContent = rs.name;
    document.getElementById('sec-tagline').textContent = rs.tagline;
    document.getElementById('sec-desc').textContent = rs.desc;
    document.getElementById('sec-meta').textContent = '性格：' + rs.traits + '　風格：' + rs.style;
    secCard.hidden = false;
  } else {
    secCard.hidden = true;
  }

  drawRadar(scores);

  document.getElementById('copy-url-btn').onclick = function(){
    var url = location.href;
    var msg = document.getElementById('url-msg');
    function done(ok){ msg.textContent = ok ? '已複製網址，傳給朋友讓他們也測測看' : '複製失敗，請手動複製網址列'; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ done(true); }).catch(function(){ done(false); });
    } else {
      done(false);
    }
  };
}

document.getElementById('retake-btn').addEventListener('click', function(){
